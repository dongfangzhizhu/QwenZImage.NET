name: Release to NuGet

# Publishing is intentionally opt-in: it only runs on an explicit v* tag
# (or a manual dispatch). The repository owner must configure the
# NUGET_API_KEY secret before the first release. See PLAN.md section 5.
#
# The shipped natives are the GPU-free REFERENCE backend (deterministic noise):
# a real CUDA build is tied to a specific SM architecture and to model weights
# the user supplies. Users who want real inference build QwenZImageNative with
# -DQZI_WITH_CUDA_ENGINE=ON and point QZI_NATIVE_LIBRARY at that artefact.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g. 0.1.0). Defaults to the tag name.'
        required: false
        type: string

permissions:
  contents: write   # needed to create the GitHub release

jobs:
  # A single NuGet package ships the managed assembly plus BOTH native RIDs.
  # Build each shared library on its own OS, then merge them in publish.
  native:
    name: native ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Windows native library + C smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-native.ps1

      - name: Build Linux native library + C smoke test
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/build-native-linux.sh

      - name: Upload native runtime
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: artifacts/runtimes/${{ matrix.rid }}/native/*
          if-no-files-found: error

  publish:
    name: Pack and publish QwenZImage.NET
    needs: native
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history for SourceLink)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download win-x64 native runtime
        uses: actions/download-artifact@v4
        with:
          name: native-win-x64
          path: artifacts/runtimes/win-x64/native

      - name: Download linux-x64 native runtime
        uses: actions/download-artifact@v4
        with:
          name: native-linux-x64
          path: artifacts/runtimes/linux-x64/native

      - name: Build and test (shipped reference backend, no GPU required)
        run: |
          dotnet build QwenZImage.NET.sln -c Release --nologo
          dotnet test QwenZImage.NET.sln -c Release --no-build --nologo

      - name: Resolve version
        id: version
        shell: bash
        run: |
          version='${{ inputs.version }}'
          if [ -z "$version" ]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$version" ]; then
            echo "::error::could not determine version"; exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing QwenZImage.NET $version"

      - name: Pack (managed + win-x64 + linux-x64)
        run: >-
          dotnet pack src/QwenZImage.NET/QwenZImage.NET.csproj
          -c Release
          -p:Version=${{ steps.version.outputs.value }}
          -o artifacts/packages
          --nologo

      - name: Verify package contains both native RIDs before publishing
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $package = Get-Item "artifacts/packages/QwenZImage.NET.${{ steps.version.outputs.value }}.nupkg"
          $required = @(
            'README.md', 'LICENSE', 'THIRD_PARTY_NOTICES.md', 'engine/LICENSE',
            'docs/NATIVE_ABI.md',
            'lib/net10.0/QwenZImage.NET.dll',
            'runtimes/win-x64/native/QwenZImageNative.dll',
            'runtimes/linux-x64/native/libQwenZImageNative.so'
          )
          $zip = [System.IO.Compression.ZipFile]::OpenRead($package.FullName)
          try {
            $names = @($zip.Entries.FullName)
            foreach ($r in $required) {
              if (-not ($names -contains $r)) { throw "refusing to publish: missing '$r'" }
            }
            Write-Host "== $($package.Name) contains all $($required.Count) required entries"
          } finally { $zip.Dispose() }

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        shell: bash
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::NUGET_API_KEY secret is not configured"; exit 1
          fi
          dotnet nuget push artifacts/packages/QwenZImage.NET.${{ steps.version.outputs.value }}.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          # Symbol package is optional; do not fail the release if the symbol
          # server rejects it.
          snupkg="artifacts/packages/QwenZImage.NET.${{ steps.version.outputs.value }}.snupkg"
          if [ -f "$snupkg" ]; then
            dotnet nuget push "$snupkg" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate || echo "::warning::symbol package push failed"
          fi

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/packages/* \
            --title "QwenZImage.NET ${{ steps.version.outputs.value }}" \
            --generate-notes

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: artifacts/packages/*
          if-no-files-found: error
