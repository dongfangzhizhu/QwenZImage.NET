name: Release to NuGet

# Publishing is intentionally opt-in: it only runs on an explicit v* tag
# (or a manual dispatch). The repository owner must configure the
# NUGET_API_KEY secret before the first release. See PLAN.md section 5.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g. 0.1.0). Defaults to the tag name.'
        required: false
        type: string

permissions:
  contents: write   # needed to create the GitHub release

jobs:
  publish:
    name: Pack and publish QwenZImage.NET
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history for SourceLink)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build and test (reference backend, no GPU required)
        shell: bash
        run: |
          bash scripts/build-native.sh
          dotnet build QwenZImage.NET.sln -c Release --nologo
          dotnet test QwenZImage.NET.sln -c Release --no-build --nologo

      - name: Resolve version
        id: version
        shell: bash
        run: |
          version='${{ inputs.version }}'
          if [ -z "$version" ]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$version" ]; then
            echo "::error::could not determine version"; exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing QwenZImage.NET $version"

      - name: Pack
        run: >-
          dotnet pack src/QwenZImage.NET/QwenZImage.NET.csproj
          -c Release
          -p:Version=${{ steps.version.outputs.value }}
          -o artifacts/packages
          --nologo

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        shell: bash
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::NUGET_API_KEY secret is not configured"; exit 1
          fi
          dotnet nuget push artifacts/packages/QwenZImage.NET.${{ steps.version.outputs.value }}.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          # Symbol package is optional; do not fail the release if the symbol
          # server rejects it.
          snupkg="artifacts/packages/QwenZImage.NET.${{ steps.version.outputs.value }}.snupkg"
          if [ -f "$snupkg" ]; then
            dotnet nuget push "$snupkg" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate || echo "::warning::symbol package push failed"
          fi

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/packages/* \
            --title "QwenZImage.NET ${{ steps.version.outputs.value }}" \
            --generate-notes

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: artifacts/packages/*
          if-no-files-found: error
