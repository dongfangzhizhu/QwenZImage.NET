name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # One native library is built natively per runner. Each is uploaded in the
  # exact RID layout NuGet expects, so the pack job can merge both platforms
  # into a single package without any cross-compiler or WSL dependency.
  native:
    name: native ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Windows native library + C smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-native.ps1

      - name: Build Linux native library + C smoke test
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/build-native-linux.sh

      - name: Verify staged RID library
        shell: pwsh
        run: |
          $dir = Join-Path 'artifacts/runtimes' '${{ matrix.rid }}/native'
          $files = @(Get-ChildItem -Path $dir -File -ErrorAction SilentlyContinue)
          if ($files.Count -eq 0) { throw "no native library staged in $dir" }
          $files | ForEach-Object { Write-Host "== $($_.FullName) ($($_.Length) bytes)" }

      - name: Upload native runtime
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: artifacts/runtimes/${{ matrix.rid }}/native/*
          if-no-files-found: error

  # Runs on both operating systems with BOTH native libraries present, so the
  # managed tests, the WebUI build and the NuGet pack are verified on Windows
  # and Linux with the exact contents that will be shipped.
  verify:
    name: verify ${{ matrix.os }}
    needs: native
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout (full history for SourceLink)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download win-x64 native runtime
        uses: actions/download-artifact@v4
        with:
          name: native-win-x64
          path: artifacts/runtimes/win-x64/native

      - name: Download linux-x64 native runtime
        uses: actions/download-artifact@v4
        with:
          name: native-linux-x64
          path: artifacts/runtimes/linux-x64/native

      - name: Build solution (library, tests, sample, WebUI)
        run: dotnet build QwenZImage.NET.sln -c Release --nologo

      - name: Run xUnit tests (no GPU required)
        run: dotnet test QwenZImage.NET.sln -c Release --no-build --nologo

      - name: Pack NuGet package
        run: dotnet pack src/QwenZImage.NET/QwenZImage.NET.csproj -c Release --no-build --nologo -o artifacts/packages

      # pwsh is available on both runner images, so this check is OS-neutral.
      # The package MUST carry the managed assembly plus both native RIDs.
      - name: Verify package contents (managed + win-x64 + linux-x64)
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $packages = @(Get-ChildItem artifacts/packages/*.nupkg)
          if ($packages.Count -eq 0) { throw 'no .nupkg produced' }
          $required = @(
            'README.md', 'LICENSE', 'THIRD_PARTY_NOTICES.md',
            'docs/NATIVE_ABI.md',
            'lib/net10.0/QwenZImage.NET.dll',
            'runtimes/win-x64/native/qzi.dll',
            'runtimes/linux-x64/native/libqzi.so'
          )
          foreach ($p in $packages) {
            $zip = [System.IO.Compression.ZipFile]::OpenRead($p.FullName)
            try {
              $names = @($zip.Entries.FullName)
              foreach ($r in $required) {
                if (-not ($names -contains $r)) { throw "missing '$r' in $($p.Name)" }
              }
              foreach ($rid in @('runtimes/win-x64/native/qzi.dll', 'runtimes/linux-x64/native/libqzi.so')) {
                $entry = $zip.Entries | Where-Object { $_.FullName -eq $rid }
                if ($entry.Length -le 0) { throw "empty native library '$rid' in $($p.Name)" }
              }
              Write-Host "== $($p.Name) ($($names.Count) entries, managed + both RID natives present)"
            } finally { $zip.Dispose() }
          }

      # Runtime smoke test of the cross-platform WebUI on Linux. The Windows
      # half is covered by the solution build above; the same ASP.NET Core app
      # runs unchanged on either OS.
      - name: WebUI runtime smoke test
        if: runner.os != 'Windows'
        shell: bash
        env:
          QZI_WEBUI_URLS: http://127.0.0.1:17860
          QZI_WEBUI_OUTPUT: ${{ github.workspace }}/artifacts/webui-smoke-output
          QZI_NATIVE_LIBRARY: ${{ github.workspace }}/artifacts/runtimes/linux-x64/native/libqzi.so
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/qzi-webui.log"
          dotnet run --project src/QwenZImage.NET.WebUI/QwenZImage.NET.WebUI.csproj \
            -c Release --no-build > "$log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; cat "$log"' EXIT
          base=http://127.0.0.1:17860
          for _ in $(seq 1 60); do
            if curl -fsS "$base/api/health" > "$RUNNER_TEMP/health.json" 2>/dev/null; then break; fi
            sleep 0.5
          done
          python3 - <<'PY'
          import json, os, urllib.request
          base = "http://127.0.0.1:17860"
          health = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "health.json")))
          assert health["ok"] is True, health
          assert health["engine"]["reference_backend"] is True, health
          presets = json.load(urllib.request.urlopen(base + "/api/presets"))["presets"]
          assert any(p["model"] == "qwen21" for p in presets), presets
          assert any(p["model"] == "zimage" for p in presets), presets
          req = urllib.request.Request(
              base + "/api/jobs",
              data=json.dumps({"model": "zimage", "prompt": "ci smoke",
                               "width": 256, "height": 256}).encode(),
              headers={"Content-Type": "application/json"}, method="POST")
          job = json.load(urllib.request.urlopen(req))
          print("submitted job", job["id"], job["state"])
          import time
          for _ in range(60):
              job = json.load(urllib.request.urlopen(f"{base}/api/jobs/{job['id']}"))
              if job["state"] in ("done", "error", "cancelled"):
                  break
              time.sleep(0.5)
          assert job["state"] == "done", job
          assert job["output_name"], job
          outputs = json.load(urllib.request.urlopen(base + "/api/outputs"))["outputs"]
          assert any(o["name"] == job["output_name"] for o in outputs), outputs
          print("WebUI smoke OK:", job["output_name"], len(outputs), "outputs")
          PY

      # Same WebUI, but pointed at a stand-in `h3 serve`. This is the path that
      # produces REAL images in production: verify the engine's PNG bytes travel
      # through the queue and land byte-for-byte in the output gallery.
      - name: WebUI real-engine (QZI_ENGINE_URL) smoke test
        if: runner.os != 'Windows'
        shell: bash
        env:
          QZI_WEBUI_URLS: http://127.0.0.1:17861
          QZI_WEBUI_OUTPUT: ${{ github.workspace }}/artifacts/webui-engine-smoke-output
        run: |
          set -euo pipefail
          mock_log="$RUNNER_TEMP/qzi-mock-engine.log"
          ui_log="$RUNNER_TEMP/qzi-webui-engine.log"
          python3 scripts/mock-h3-serve.py --port 18411 > "$mock_log" 2>&1 &
          mock_pid=$!
          QZI_ENGINE_URL=http://127.0.0.1:18411 \
            dotnet run --project src/QwenZImage.NET.WebUI/QwenZImage.NET.WebUI.csproj \
              -c Release --no-build > "$ui_log" 2>&1 &
          ui_pid=$!
          trap 'kill "$ui_pid" "$mock_pid" 2>/dev/null || true; cat "$ui_log" "$mock_log"' EXIT
          base=http://127.0.0.1:17861
          for _ in $(seq 1 60); do
            if curl -fsS "$base/api/health" > "$RUNNER_TEMP/engine-health.json" 2>/dev/null; then break; fi
            sleep 0.5
          done
          python3 - <<'PY'
          import json, os, time, urllib.request
          base = "http://127.0.0.1:17861"
          health = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "engine-health.json")))
          assert health["ok"] is True, health
          assert health["transport"] == "h3-serve-http", health
          assert health["engine"]["reference_backend"] is False, health
          assert health["engine"]["backend"] == "h3-serve", health
          req = urllib.request.Request(
              base + "/api/jobs",
              data=json.dumps({"model": "qwen21", "prompt": "ci real-engine smoke",
                               "width": 256, "height": 256, "seed": 42,
                               "tier": "turbo", "steps": 8, "guidance": 1.0}).encode(),
              headers={"Content-Type": "application/json"}, method="POST")
          job = json.load(urllib.request.urlopen(req))
          for _ in range(60):
              job = json.load(urllib.request.urlopen(f"{base}/api/jobs/{job['id']}"))
              if job["state"] in ("done", "error", "cancelled"):
                  break
              time.sleep(0.5)
          assert job["state"] == "done", job
          data = urllib.request.urlopen(base + job["output_url"]).read()
          assert data == b"\x89PNG\r\n\x1a\nQZI-MOCK-ENGINE-PNG", data
          print("real-engine bridge OK:", job["output_name"], len(data), "bytes")
          PY
          # Assert against the raw WIRE bytes, not the fixture's re-serialised
          # JSON: this is exactly what H3ServeExecutor sent to the C engine.
          wire=$(grep '^WIRE ' "$mock_log" | tail -n 1)
          test -n "$wire"
          grep -q '"model":"qwen21"' <<< "$wire"
          grep -q '"tier":"turbo"' <<< "$wire"
          grep -q '"steps":8' <<< "$wire"
          grep -q '"guidance":1.0' <<< "$wire"      # literal 1.0, not 1
          if grep -q '"negative_prompt"' <<< "$wire"; then
            echo "::error::qwen21 turbo must not send negative_prompt"; exit 1
          fi

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nupkg-${{ matrix.os }}
          path: artifacts/packages/*
          if-no-files-found: error
